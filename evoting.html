  <script src="assets/vendor/aos/aos.js"></script>
  
  <script>
    // Initialize AOS animations
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 800, once: true });
    });

    document.getElementById('votingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payButton = document.getElementById('payButton');
      payButton.disabled = true;
      payButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';

      const formData = new FormData(this);
      let totalVotes = 0;
      let voteDetails = {};

      // Extract names and amounts dynamically
      for (let [key, value] of formData.entries()) {
        if (value && value.trim() !== '' && value !== '0') {
          if (key.includes('-amount')) {
            totalVotes += parseInt(value);
          }
          voteDetails[key] = value;
        }
      }

      if (totalVotes === 0) {
        Swal.fire('Error', 'Please cast at least one vote to proceed.', 'error');
        payButton.disabled = false;
        payButton.innerHTML = 'Proceed To Payment via Selar';
        return;
      }

      // Assuming 1 vote = 100 Naira
      const amountToPay = totalVotes * 100;

      // Link to your updated Selar Product
      const selarBaseUrl = "https://selar.co/6977977p71";
      
      // Serialize the voting details to pass securely in Selar's notes
      const checkoutUrl = `${selarBaseUrl}?amount=${amountToPay}&notes=${encodeURIComponent(JSON.stringify(voteDetails))}`;

      Swal.fire({
        title: 'Confirm Checkout',
        text: `You have selected ${totalVotes} vote(s). The total is ₦${amountToPay}.`,
        icon: 'info',
        showCancelButton: true,
        confirmButtonText: 'Proceed to Selar',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#1b8c0c'
      }).then((result) => {
        if (result.isConfirmed) {
          window.location.href = checkoutUrl;
        } else {
          payButton.disabled = false;
          payButton.innerHTML = 'Proceed To Payment via Selar';
        }
      });
    });
  </script>
