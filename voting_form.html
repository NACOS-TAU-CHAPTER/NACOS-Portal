<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vote Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="background:#f4f7fa;">

  <div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4 p-5">
      <div class="d-flex justify-content-start mb-4">
        <a href="index.html" class="btn btn-outline-success">
          Home
        </a>
      </div>
      <h2 class="text-center mb-4">
        The NACTA Awards 2026 (NACOS TAU Awards )
      </h2>

      <!-- Voting Form -->
      <form id="votingForm">

        <!-- Tech Innovator of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Tech Innovator of the year</label>
            <input type="text" class="form-control" name="tech-innovator" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="tech-innovator-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Faculty icon of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Faculty Icon of the year</label>
            <input type="text" class="form-control" name="faculty-icon" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="faculty-icon-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Sportsman of the Year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Sportsman of the Year</label>
            <input type="text" class="form-control" name="sportsman" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="sportsman-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Best Course Representative -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Course Representative</label>
            <input type="text" class="form-control" name="course-rep" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="course-rep-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Best Dressed Male of the Faculty -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Dressed Male of the Faculty</label>
            <input type="text" class="form-control" name="best-dressed-male" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="best-dressed-male-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Best Dressed Female of the Faculty -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Dressed Female of the Faculty</label>
            <input type="text" class="form-control" name="best-dressed-female" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="best-dressed-female-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Best Lecturer of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Lecturer of the year</label>
            <input type="text" class="form-control" name="best-lecturer" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="best-lecturer-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Most Influential -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Most Influential</label>
            <input type="text" class="form-control" name="most-influential" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="most-influential-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Outstanding executive of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Outstanding Executive of the year</label>
            <input type="text" class="form-control" name="outstanding-executive" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="outstanding-executive-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Most Popular figure -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Most Popular Figure</label>
            <input type="text" class="form-control" name="most-popular" placeholder="Enter candidate name" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="most-popular-amount" min="1" value="1" required>
          </div>
        </div>

        <!-- Payment Button -->
        <button type="submit" class="btn btn-success w-100 py-3" id="payButton">
          Proceed To Payment
        </button>

      </form>

    </div>

  </div>

  <script>
    document.getElementById('votingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payButton = document.getElementById('payButton');
      payButton.disabled = true;
      payButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';

      // 1. Gather all the voting data from the form
      const formData = new FormData(this);
      let totalVotes = 0;
      let voteDetails = {};

      for (let [key, value] of formData.entries()) {
        if (value && value.trim() !== '') {
          if (key.includes('-amount')) {
            totalVotes += parseInt(value);
          }
          voteDetails[key] = value;
        }
      }

      if (totalVotes === 0) {
        Swal.fire('Error', 'Please cast at least one vote to proceed.', 'error');
        payButton.disabled = false;
        payButton.innerHTML = 'Proceed To Payment';
        return;
      }

      // Assume 1 vote = 100 Naira (Change this to your actual rate)
      const amountToPay = totalVotes * 100;

      // 2. SELAR INTEGRATION LOGIC GOES HERE
      // Replace 'YOUR_SELAR_LINK' with your actual Selar product link
      // We encode the vote details as a string so we can pass it as a custom parameter if needed
      const selarBaseUrl = "https://selar.co/YOUR_PRODUCT_CODE";
      
      // Example of passing data in URL (check Selar docs for their exact custom field formatting)
      const checkoutUrl = `${selarBaseUrl}?amount=${amountToPay}&custom_notes=${encodeURIComponent(JSON.stringify(voteDetails))}`;

      Swal.fire({
        title: 'Redirecting to Selar',
        text: `You are about to pay ₦${amountToPay} for ${totalVotes} votes.`,
        icon: 'info',
        showCancelButton: true,
        confirmButtonText: 'Proceed',
        confirmButtonColor: '#1b8c0c'
      }).then((result) => {
        if (result.isConfirmed) {
          // Redirect the user to Selar
          window.location.href = checkoutUrl;
        } else {
          payButton.disabled = false;
          payButton.innerHTML = 'Proceed To Payment';
        }
      });
    });
  </script>
</body>

</html>
