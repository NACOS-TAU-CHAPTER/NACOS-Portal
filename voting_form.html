<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vote Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="background:#f4f7fa;">

  <div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4 p-5">
      <div class="d-flex justify-content-start mb-4">
        <a href="index.html" class="btn btn-outline-success">
          Home
        </a>
      </div>
      <h2 class="text-center mb-4">
        The NACTA Awards 2026 (NACOS TAU Awards )
      </h2>

      <!-- Voting Form -->
      <form id="votingForm">

        <!-- Tech Innovator of the year -->

          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Tech Innovator of the year</label>
            <select class="form-select" name="tech-innovator">

              <option value="Akinlotan Victor">Akinlotan Victor</option>
              <option value="Ajetomobi Praise">Ajetomobi Praise</option>
              <option value="Samuel">Samuel</option>
              <option value="Nabeel">Nabeel</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="tech-innovator-amount" min="0" value="0">
          </div>
        </div>

        <!-- Faculty icon of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Faculty Icon of the year</label>
            <select class="form-select" name="faculty-icon">
              <option value="">Select candidate</option>
              <option value="Hayat">Hayat</option>
              <option value="Father KD">Father KD</option>
              <option value="Eri">Eri</option>
              <option value="Ajetomobi Praise">Ajetomobi Praise</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="faculty-icon-amount" min="0" value="0">
          </div>
        </div>

        <!-- Sportsman of the Year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Sportsman of the Year</label>
            <select class="form-select" name="sportsman">
              <option value="">Select candidate</option>
              <option value="Al Amen">Al Amen</option>
              <option value="Williams">Williams</option>
              <option value="Ibadan">Ibadan</option>
              <option value="Father KD">Father KD</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="sportsman-amount" min="0" value="0">
          </div>
        </div>

        <!-- Best Course Representative -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Course Representative</label>
            <select class="form-select" name="course-rep">
              <option value="">Select candidate</option>
              <option value="Henry">Henry</option>
              <option value="Faiz">Faiz</option>
              <option value="Daniel">Daniel</option>
              <option value="Michael">Michael</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="course-rep-amount" min="0" value="0">
          </div>
        </div>

        <!-- Best Dressed Male of the Faculty -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Dressed Male of the Faculty</label>
            <select class="form-select" name="best-dressed-male">
              <option value="">Select candidate</option>
              <option value="Tech Kingsley">Tech Kingsley</option>
              <option value="Siraj">Siraj</option>
              <option value="Quayum">Quayum</option>
              <option value="Femi">Femi</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="best-dressed-male-amount" min="0" value="0">
          </div>
        </div>

        <!-- Best Dressed Female of the Faculty -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Best Dressed Female of the Faculty</label>
            <select class="form-select" name="best-dressed-female">
              <option value="">Select candidate</option>
              <option value="Stephanie">Stephanie</option>
              <option value="Daniella">Daniella</option>
              <option value="Khadijah">Khadijah</option>
              <option value="Ike Oluwa">Ike Oluwa</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="best-dressed-female-amount" min="0" value="0">
          </div>
        </div>

        <!-- Most Influential -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Most Influential</label>
            <select class="form-select" name="most-influential">
              <option value="">Select candidate</option>
              <option value="KD">KD</option>
              <option value="Femi">Femi</option>
              <option value="Siraj">Siraj</option>
              <option value="Henry">Henry</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="most-influential-amount" min="0" value="0">
          </div>
        </div>

        <!-- Outstanding executive of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Outstanding Executive of the year</label>
            <select class="form-select" name="outstanding-executive">
              <option value="">Select candidate</option>
              <option value="Hayat">Hayat</option>
              <option value="Praise">Praise</option>
              <option value="Stephanie">Stephanie</option>
              <option value="Daniella">Daniella</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="outstanding-executive-amount" min="0" value="0">
          </div>
        </div>

        <!-- Most Popular figure -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Most Popular Figure</label>
            <select class="form-select" name="most-popular">
              <option value="">Select candidate</option>
              <option value="Siraj">Siraj</option>
              <option value="KD">KD</option>
              <option value="Femi">Femi</option>
              <option value="Ibadan">Ibadan</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="most-popular-amount" min="0" value="0">
          </div>
        </div>

        <!-- Programmer of the year -->
        <div class="row mb-4">
          <div class="col-md-8 mb-3 mb-md-0">
            <label class="form-label">Programmer of the Year</label>
            <select class="form-select" name="programmer">
              <option value="">Select candidate</option>
              <option value="Akinlotan Victor">Akinlotan Victor</option>
              <option value="Eri">Eri</option>
              <option value="Phillip Success">Phillip Success</option>
              <option value="Tech Kingsley">Tech Kingsley</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vote amount</label>
            <input type="number" class="form-control" name="programmer-amount" min="0" value="0">
          </div>
        </div>

        <!-- Payment Button -->
        <button type="submit" class="btn btn-success w-100 py-3" id="payButton">
          Proceed To Payment
        </button>

      </form>

    </div>

  </div>

  <script>
    // Automatically set amount to 1 when a candidate is selected, or 0 when unselected
    document.querySelectorAll('.form-select').forEach(select => {
      select.addEventListener('change', function() {
        const amountInput = document.querySelector(`input[name="${this.name}-amount"]`);
        if (this.value !== '' && amountInput.value == 0) {
          amountInput.value = 1;
        } else if (this.value === '') {
          amountInput.value = 0;
        }
      });
    });

    document.getElementById('votingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payButton = document.getElementById('payButton');
      payButton.disabled = true;
      payButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';

      // 1. Gather all the voting data from the form
      const formData = new FormData(this);
      let totalVotes = 0;
      let voteDetails = {};

      const categories = [
        'tech-innovator', 'faculty-icon', 'sportsman', 'course-rep',
        'best-dressed-male', 'best-dressed-female', 'most-influential',
        'outstanding-executive', 'most-popular', 'programmer'
      ];

      categories.forEach(cat => {
        const candidate = formData.get(cat);
        const amount = parseInt(formData.get(cat + '-amount')) || 0;
        
        if (candidate && candidate.trim() !== '' && amount > 0) {
          totalVotes += amount;
          voteDetails[cat] = candidate;
          voteDetails[cat + '-amount'] = amount;
        }
      });

      if (totalVotes === 0) {
        Swal.fire('Error', 'Please cast at least one vote to proceed.', 'error');
        payButton.disabled = false;
        payButton.innerHTML = 'Proceed To Payment';
        return;
      }

      // Assume 1 vote = 100 Naira (Change this to your actual rate)
      const amountToPay = totalVotes * 100;

      // 2. SELAR INTEGRATION
      // First, store votes in database and get session ID
      fetch('/.netlify/functions/store_votes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voteDetails })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          throw new Error(data.error);
        }
        
        // Your Selar product link with session ID
        const selarProductUrl = "https://selar.co/6977977p71";
        const checkoutUrl = `${selarProductUrl}?session_id=${data.sessionId}`;

        Swal.fire({
        title: 'Redirecting to Payment',
        html: `
          <p>You are about to pay <strong>₦${amountToPay.toLocaleString()}</strong> for <strong>${totalVotes}</strong> vote${totalVotes > 1 ? 's' : ''}.</p>
          <div style="text-align: left; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 5px; max-height: 200px; overflow-y: auto;">
            ${Object.keys(voteDetails).filter(k => !k.includes('-amount')).map(category => {
              const candidate = voteDetails[category];
              const amount = voteDetails[`${category}-amount`];
              return `<div style="padding: 5px 0;"><strong>${category.replace(/-/g, ' ')}:</strong> ${candidate} (${amount} vote${amount > 1 ? 's' : ''})</div>`;
            }).join('')}
          </div>
        `,
        icon: 'info',
        showCancelButton: true,
        confirmButtonText: 'Proceed to Payment',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#1b8c0c'
      }).then((result) => {
        if (result.isConfirmed) {
          // Redirect the user to Selar
          window.location.href = checkoutUrl;
        } else {
          payButton.disabled = false;
          payButton.innerHTML = 'Proceed To Payment';
        }
      });
      })
      .catch(error => {
        console.error('Error storing votes:', error);
        Swal.fire('Error', 'Failed to prepare payment. Please try again.', 'error');
        payButton.disabled = false;
        payButton.innerHTML = 'Proceed To Payment';
      });
    });
  </script>
</body>

</html>
