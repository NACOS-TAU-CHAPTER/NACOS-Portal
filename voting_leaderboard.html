<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>NACOS - Voting Leaderboard</title>
  
  <!-- Favicons -->
  <link href="assets/img/tau_logo-removebg-preview.png" rel="icon">
  <link href="assets/img/tau_logo-removebg-preview.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
  
  <style>
    body { background-color: #f8fbfc; }
    .main { margin-top: 100px; min-height: 70vh; }
  </style>
</head>

<body class="index-page">

  <header id="header" class="header d-flex align-items-center fixed-top bg-white shadow-sm">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center">
        <img src="assets/img/nacos logo.jpg" alt="NACOS Logo" style="height: 45px;">
        <div class="ms-2">
          <span style="color: #1b8c0c; font-weight: 700;">NACOS</span>
          <span style="font-size: 10px; display: block; color: #777;">TAU Chapter</span>
        </div>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="voting-leaderboard.html" class="active" style="color: #1b8c0c; font-weight: 600;">Live Leaderboard</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>
    </div>
  </header>

  <main class="main">
    <section id="leaderboard" class="section">
      <div class="container section-title pb-4" data-aos="fade-up">
        <h2>Live Voting Leaderboard</h2>
        <p>Real-time top 10 results for the NACOS E-Voting.</p>
      </div>

      <!-- The leaderboard cards will be dynamically injected here by leaderboard.js -->
      <div class="container" id="leaderboard-container">
         <!-- Content loaded via JS -->
      </div>
    </section>
  </main>

  <footer id="footer" class="footer position-relative light-background mt-5">
    <div class="container copyright text-center mt-4">
      <p> <span>Copyright</span> © <strong class="px-1 sitename">NACOS - TAU Development Team.</strong><br><span>All Rights Reserved.</span></p>
    </div>
  </footer>

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  
  <!-- Essential Config and Environment files -->
  <script src="assets/js/env.js"></script>
  <script src="config.local.js"></script>

  <!-- Initialize Supabase and Fetch the Leaderboard -->
  <script type="module" src="assets/js/leaderboard.js"></script>
  
  <script>
    // Simple Mobile Nav Toggle for the specific page
    document.addEventListener('DOMContentLoaded', () => {
      const mobileNavToggleBtn = document.querySelector('.mobile-nav-toggle');
      if(mobileNavToggleBtn) {
        mobileNavToggleBtn.addEventListener('click', function() {
          document.querySelector('body').classList.toggle('mobile-nav-active');
          this.classList.toggle('bi-list');
          this.classList.toggle('bi-x');
        });
      }
    });
  </script>
</body>

</html>
