<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Webhook Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg border-0 rounded-4 p-5">
      <h2 class="text-center mb-4">🔍 Simple Webhook Diagnostic Test</h2>
      
      <div class="alert alert-info">
        <strong>This test will show you exactly what error is happening.</strong>
        <p class="mb-0 mt-2">Click the button below to test your webhook function.</p>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button class="btn btn-primary btn-lg" onclick="testWebhook()">
          🚀 Test Webhook Now
        </button>
      </div>

      <div id="result" class="mt-4" style="display: none;">
        <h4>Result:</h4>
        <div id="resultContent" class="p-3 border rounded" style="background: #f8f9fa; white-space: pre-wrap; font-family: monospace; max-height: 500px; overflow-y: auto;"></div>
      </div>

      <div id="logs" class="mt-4">
        <h5>Test Log:</h5>
        <div id="logContent" class="p-3 border rounded" style="background: #f8f9fa; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <script>
    function log(message) {
      const logDiv = document.getElementById('logContent');
      const timestamp = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${timestamp}] ${message}\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function testWebhook() {
      const resultDiv = document.getElementById('result');
      const resultContent = document.getElementById('resultContent');
      const logContent = document.getElementById('logContent');
      
      // Clear previous results
      logContent.innerHTML = '';
      resultContent.innerHTML = '';
      resultDiv.style.display = 'none';

      log('Starting webhook test...');

      // Build test data
      const testData = {
        'tech-innovator': 'Akinlotan Victor',
        'tech-innovator-amount': '5',
        'faculty-icon': 'Hayat',
        'faculty-icon-amount': '3'
      };

      const reference = 'TEST_REF_' + Date.now();
      const email = 'test@nacos.com';
      const encodedData = encodeURIComponent(JSON.stringify(testData));

      const url = `https://nacos-tau.netlify.app/.netlify/functions/selar_webhook?reference=${reference}&email=${email}&custom_notes=${encodedData}`;

      log('Test URL: ' + url);
      log('Sending request...');

      try {
        const response = await fetch(url);
        
        log(`Response status: ${response.status} ${response.statusText}`);
        log(`Response headers: ${JSON.stringify([...response.headers.entries()])}`);

        const contentType = response.headers.get('content-type');
        let responseData;

        if (contentType && contentType.includes('application/json')) {
          responseData = await response.json();
          log('Response type: JSON');
        } else {
          responseData = await response.text();
          log('Response type: HTML/Text');
        }

        // Show result
        resultDiv.style.display = 'block';
        
        if (response.ok) {
          log('✅ SUCCESS! Webhook responded successfully.');
          resultContent.innerHTML = responseData;
          resultContent.style.background = '#d4edda';
          resultContent.style.color = '#155724';
        } else {
          log('❌ ERROR! Webhook returned an error.');
          resultContent.innerHTML = responseData;
          resultContent.style.background = '#f8d7da';
          resultContent.style.color = '#721c24';
        }

      } catch (error) {
        log('❌ FETCH ERROR: ' + error.message);
        resultDiv.style.display = 'block';
        resultContent.innerHTML = `Network Error: ${error.message}\n\nThis usually means:\n1. The function doesn't exist\n2. Network connectivity issue\n3. CORS issue`;
        resultContent.style.background = '#f8d7da';
        resultContent.style.color = '#721c24';
      }
    }

    // Auto-run on page load
    window.addEventListener('load', () => {
      log('Page loaded. Ready to test.');
      log('Click the button above to start the test.');
    });
  </script>
</body>
</html>
